<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:fragment="layout(pageTitle, pageSubtitle, activePage, content)">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle != null ? pageTitle + ' · Haven Glam Admin' : 'Haven Glam · Panel de Administración'}">
        Haven Glam · Panel de Administración</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap"
            rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="../../Static/css/admin.css" th:href="@{/css/admin.css}">
    <th:block layout:fragment="extraStyles"></th:block>
</head>

<body class="admin-app">

<div class="admin-shell">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="adminSidebar">

        <a th:href="@{/admin/dashboard}" href="/admin/dashboard" class="sidebar-brand">
            <span class="brand-symbol">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
                </svg>
            </span>
            <span class="brand-text">
                <span class="brand-title">Haven Glam</span>
                <span class="brand-tagline">Panel de Administración</span>
            </span>
        </a>

        <div class="sidebar-flourish" aria-hidden="true"></div>

        <nav class="sidebar-nav" aria-label="Navegación de administración">

            <a th:href="@{/admin/dashboard}" href="/admin/dashboard" class="sidebar-link"
               th:classappend="${activePage == 'dashboard'} ? 'is-active' : ''">
                <span class="sidebar-icon-chip">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
                        <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
                        <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
                        <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
                    </svg>
                </span>
                <span>Dashboard</span>
            </a>

            <a th:href="@{/admin/servicios}" href="/admin/servicios" class="sidebar-link"
               th:classappend="${activePage == 'servicios'} ? 'is-active' : ''">
                <span class="sidebar-icon-chip">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L14 8L20 8.5L15.5 12.5L17 19L12 15.5L7 19L8.5 12.5L4 8.5L10 8Z"></path>
                    </svg>
                </span>
                <span>Servicios</span>
            </a>

            <a th:href="@{/admin/empleados}" href="/admin/empleados" class="sidebar-link"
               th:classappend="${activePage == 'empleados'} ? 'is-active' : ''">
                <span class="sidebar-icon-chip">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </span>
                <span>Empleados</span>
            </a>

            <a th:href="@{/admin/productos}" href="/admin/productos" class="sidebar-link"
               th:classappend="${activePage == 'productos'} ? 'is-active' : ''">
                <span class="sidebar-icon-chip">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"></path>
                        <path d="M3.27 8.27L12 13l8.73-4.73"></path>
                        <path d="M12 21.5V13"></path>
                    </svg>
                </span>
                <span>Productos</span>
            </a>

            <a th:href="@{/admin/citas}" href="/admin/citas" class="sidebar-link"
               th:classappend="${activePage == 'citas'} ? 'is-active' : ''">
                <span class="sidebar-icon-chip">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="17" rx="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </span>
                <span>Citas</span>
            </a>

        </nav>

        <div class="sidebar-footer">

            <div class="sidebar-profile-card">
                <span class="profile-avatar" th:text="${nombreAdmin != null ? #strings.substring(nombreAdmin,0,1) : 'A'}">A</span>
                <span class="sidebar-profile-info">
                    <span class="sidebar-profile-name" th:text="${nombreAdmin != null ? nombreAdmin : 'Administrador'}">Administrador</span>
                    <span class="sidebar-profile-role">Administración</span>
                </span>
            </div>

            <a th:href="@{/logout}" href="/logout" class="sidebar-link sidebar-logout">
                <span class="sidebar-icon-chip">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </span>
                <span>Cerrar sesión</span>
            </a>
        </div>

    </aside>

    <!-- CONTENIDO -->
    <div class="admin-main">

        <header class="admin-topbar">
            <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Abrir menú" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <div class="topbar-heading">
                <h1 class="topbar-title" th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</h1>
                <p class="topbar-subtitle" th:if="${pageSubtitle != null}" th:text="${pageSubtitle}">Resumen general</p>
            </div>

            <div class="topbar-profile" id="topbarProfile">
                <button class="profile-trigger" id="profileTrigger" aria-haspopup="true" aria-expanded="false">
                    <span class="profile-avatar" th:text="${nombreAdmin != null ? #strings.substring(nombreAdmin,0,1) : 'A'}">A</span>
                    <span class="profile-name" th:text="${nombreAdmin != null ? nombreAdmin : 'Administrador'}">Administrador</span>
                    <svg class="profile-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="profile-menu" id="profileMenu">
                    <a th:href="@{/admin/perfil}" href="/admin/perfil">Mi perfil</a>
                    <a th:href="@{/logout}" href="/logout">Cerrar sesión</a>
                </div>
            </div>
        </header>

        <main class="admin-content" id="adminContent">
            <div layout:fragment="content">
                <th:block th:if="${content != null}" th:insert="${content}"></th:block>
            </div>
        </main>

    </div>

</div>

<script th:src="@{/js/admin.js}"></script>
<script src="../../Static/js/admin.js" th:src="@{/js/admin.js}"></script>
<th:block layout:fragment="extraScripts"></th:block>

</body>
</html>
