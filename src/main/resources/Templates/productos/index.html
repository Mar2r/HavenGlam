<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Productos · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/Producto.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container producto-page">
        <div class="admin-card">
            <div class="admin-card-header">
                <h2>Inventario de Productos</h2>
                <a th:href="@{/productos/crear}" class="btn btn-primary">+ Nuevo producto</a>
            </div>
            <table class="admin-table">
                <thead>
                <tr><th>Imagen</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="producto : ${productos}">
                    <td>
                        <img th:if="${producto.imagenUrl != null}" th:src="${producto.imagenUrl}"
                             style="width: 48px; height: 48px; object-fit: cover; border-radius: 6px;" alt="Producto" />
                        <span th:if="${producto.imagenUrl == null}" style="color:var(--muted); font-size: 0.8rem;">Sin foto</span>
                    </td>
                    <td th:text="${producto.nombreProducto}"></td>
                    <td th:text="${producto.categoria != null ? producto.categoria.nombreCategoria : ''}"></td>
                    <td th:text="${'$' + producto.precio}"></td>
                    <td>
                        <span th:text="${producto.stock}"
                              th:style="${producto.stock <= 5 ? 'color:#8C2F2F; font-weight:600;' : ''}"></span>
                        <span th:if="${producto.stock <= 5}" style="font-size:0.75rem; color:#8C2F2F;"> (Bajo)</span>
                    </td>
                    <td th:text="${producto.estado != null ? producto.estado.nombreEstado : ''}"></td>
                    <td class="admin-table-actions">
                        <a th:href="@{/productos/detalles/{id}(id=${producto.idProducto})}" class="btn btn-info">Ver</a>
                        <a th:href="@{/productos/editar/{id}(id=${producto.idProducto})}" class="btn btn-secondary">Editar</a>
                        <a th:href="@{/productos/eliminar/{id}(id=${producto.idProducto})}" class="btn btn-danger">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="7" class="admin-table-empty">No hay productos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/producto.js}"></script>
</th:block>
</body>
</html>
