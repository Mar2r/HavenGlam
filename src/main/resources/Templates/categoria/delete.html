<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Eliminar Categoría · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/categoria.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container categoria-page">

        <div class="admin-card admin-card--form">
            <div class="admin-card-header">
                <h2>Eliminar Categoría</h2>
            </div>

            <div class="admin-warning-box">
                ¿Estás seguro de que deseas eliminar la categoría
                "<strong th:text="${categoria.nombreCategoria}">Cabello</strong>"?
                Esta acción no se puede deshacer.
            </div>

            <form th:action="@{'/categorias/delete/' + ${categoria.idCategoria}}" method="post" class="admin-delete-form">
                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-primary" style="background:#8C2F2F; color:#FFFFFF !important;">Sí, eliminar</button>
                    <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/categoria.js}"></script>
</th:block>
</body>
</html>
