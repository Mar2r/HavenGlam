<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">
<head>
    <meta charset="UTF-8" />
    <title>Detalle del empleado</title>
    <link rel="stylesheet" th:href="@{/css/empleados.css}">
</head>
<body>

<div layout:fragment="content">

    <div class="container empleado-page">
        <div class="admin-card">
            <div class="admin-card-header">
                <h2>Detalle del empleado</h2>
            </div>

            <dl class="admin-detail-grid">
                <div class="admin-detail-item">
                    <dt>Nombre completo</dt>
                    <dd th:text="${empleado.persona != null ? empleado.persona.nombre + ' ' + empleado.persona.apellido : '—'}">Juan Pérez</dd>
                </div>
                <div class="admin-detail-item">
                    <dt>Teléfono</dt>
                    <dd th:text="${empleado.persona != null ? empleado.persona.telefono : '—'}">70000000</dd>
                </div>
                <div class="admin-detail-item">
                    <dt>DUI</dt>
                    <dd th:text="${empleado.persona != null and empleado.persona.dui != null ? empleado.persona.dui : '—'}">—</dd>
                </div>
                <div class="admin-detail-item">
                    <dt>Dirección</dt>
                    <dd th:text="${empleado.persona != null and empleado.persona.direccion != null ? empleado.persona.direccion : '—'}">—</dd>
                </div>
                <div class="admin-detail-item">
                    <dt>Estado</dt>
                    <dd th:text="${empleado.estado != null ? empleado.estado.nombreEstado : '—'}">Activo</dd>
                </div>
            </dl>

            <div class="admin-form-actions">
                <a th:href="@{'/empleados/editar/' + ${empleado.idEmpleado}}" class="btn btn-primary">Editar</a>
                <a th:href="@{/empleados}" class="btn btn-secondary">Volver</a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
