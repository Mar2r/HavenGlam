<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Acceso denegado · Haven Glam</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body class="error-body">
<div class="error-center-wrap">
    <div class="error-card">
        <span class="error-code">403</span>
        <h1 th:text="${titulo} ?: 'Acceso denegado'">Acceso denegado</h1>
        <p th:text="${mensaje} ?: 'No tienes permisos suficientes para acceder a esta sección.'"></p>
        <a th:href="@{/}" class="error-btn">Volver al inicio</a>
    </div>
</div>
</body>
</html>
