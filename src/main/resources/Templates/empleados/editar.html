<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">
<head>
    <meta charset="UTF-8" />
    <title>Editar empleado</title>
    <link rel="stylesheet" th:href="@{/css/empleados.css}">
</head>
<body>

<div layout:fragment="content">

    <div class="container empleado-page">

        <div class="admin-card admin-card--form">
            <div class="admin-card-header">
                <h2>Editar empleado</h2>
            </div>

            <form th:action="@{'/empleados/guardar'}" th:object="${empleado}" method="post">

                <input type="hidden" th:field="*{idEmpleado}" />

                <div class="admin-form-row">
                    <div class="admin-form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{persona.nombre}" />
                        <div class="admin-error" th:if="${#fields.hasErrors('persona.nombre')}" th:errors="*{persona.nombre}"></div>
                    </div>

                    <div class="admin-form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" th:field="*{persona.apellido}" />
                        <div class="admin-error" th:if="${#fields.hasErrors('persona.apellido')}" th:errors="*{persona.apellido}"></div>
                    </div>
                </div>

                <div class="admin-form-row">
                    <div class="admin-form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" th:field="*{persona.telefono}" />
                        <div class="admin-error" th:if="${#fields.hasErrors('persona.telefono')}" th:errors="*{persona.telefono}"></div>
                    </div>

                    <div class="admin-form-group">
                        <label for="dui">DUI</label>
                        <input type="text" id="dui" th:field="*{persona.dui}" />
                        <div class="admin-error" th:if="${#fields.hasErrors('persona.dui')}" th:errors="*{persona.dui}"></div>
                    </div>
                </div>

                <div class="admin-form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" th:field="*{persona.direccion}" />
                    <div class="admin-error" th:if="${#fields.hasErrors('persona.direccion')}" th:errors="*{persona.direccion}"></div>
                </div>

                <div class="admin-form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" th:field="*{estado}" required>
                        <option th:each="e : ${estados}"
                                th:value="${e.idEstado}"
                                th:text="${e.nombreEstado}"></option>
                    </select>
                    <div class="admin-error" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                </div>

                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <a th:href="@{/empleados}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>

    </div>

</div>

</body>
</html>
