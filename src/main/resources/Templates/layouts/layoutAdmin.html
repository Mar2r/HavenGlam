<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:fragment="layout(pageTitle, pageSubtitle, activePage, content)">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle != null ? pageTitle + ' · Haven Glam Admin' : 'Haven Glam · Panel de administración'}">
        Haven Glam · Panel de administración</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="../../Static/css/admin.css" th:href="@{/css/admin.css}">
    <th:block layout:fragment="extraStyles"></th:block>
</head>

<body class="admin-app">
<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="adminSidebar">
        <div class="brand">Haven Glam<span>PANEL DE ADMINISTRACIÓN</span></div>

        <nav>
            <a th:href="@{/admin/dashboard}" href="/admin/dashboard" class="nav-item"
               th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                Dashboard
            </a>
            <a th:href="@{/servicios}" href="/servicios" class="nav-item"
               th:classappend="${activePage == 'servicios'} ? 'active' : ''">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><circle cx="18" cy="17" r="2.4"/></svg>
                Servicios
            </a>
            <a th:href="@{/empleados}" href="/empleados/" class="nav-item"
               th:classappend="${activePage == 'empleados'} ? 'active' : ''">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6.4 7-6.4s7 2.8 7 6.4"/></svg>
                Empleados
            </a>
            <a th:href="@{/productos}" href="/productos" class="nav-item"
               th:classappend="${activePage == 'productos'} ? 'active' : ''">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.27 8.27L12 13l8.73-4.73"/><path d="M12 21.5V13"/></svg>
                Productos
            </a>
            <a th:href="@{/citas}" href="/citas" class="nav-item"
               th:classappend="${activePage == 'citas'} ? 'active' : ''">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                Citas
            </a>
        </nav>

        <div class="sidebar-foot">
            <div class="avatar-ring" th:text="${nombreAdmin != null ? #strings.substring(nombreAdmin,0,1) : 'A'}">A</div>
            <div>
                <div class="who" th:text="${nombreAdmin != null ? nombreAdmin : 'Administrador'}">Administrador</div>
                <div class="role">Administración</div>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main>

        <div class="topbar">
            <div style="display:flex; align-items:center; gap:14px;">
                <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Abrir menú">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div>
                    <h1 th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</h1>
                    <div class="date" th:if="${pageSubtitle != null}" th:text="${pageSubtitle}">Resumen general</div>
                </div>
            </div>

            <div class="top-right">
                <div class="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                    <input type="text" placeholder="Buscar clienta, cita o servicio…" disabled title="Próximamente">
                </div>
                <div class="topbar-profile" id="topbarProfile">
                    <button class="profile-trigger" id="profileTrigger">
                        <span class="avatar-ring" th:text="${nombreAdmin != null ? #strings.substring(nombreAdmin,0,1) : 'A'}">A</span>
                        <span class="pname" th:text="${nombreAdmin != null ? nombreAdmin : 'Administrador'}">Administrador</span>
                        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="profile-menu" id="profileMenu">
                        <a th:href="@{/admin/perfil}" href="/admin/perfil">Mi perfil</a>
                        <a th:href="@{/logout}" href="/logout">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </div>

        <div layout:fragment="content">
            <th:block th:if="${content != null}" th:insert="${content}"></th:block>
        </div>

    </main>
</div>

<script th:src="@{/js/admin.js}"></script>
<script src="../../Static/js/admin.js" th:src="@{/js/admin.js}"></script>
<th:block layout:fragment="extraScripts"></th:block>

</body>
</html>
