<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>No encontrado · Haven Glam</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body class="error-body">
<div class="error-center-wrap">
    <div class="error-card">
        <span class="error-code">404</span>
        <h1 th:text="${titulo} ?: 'Página no encontrada'">Página no encontrada</h1>
        <p th:text="${mensaje} ?: 'La página o el recurso que buscas no existe o fue movido.'"></p>
        <a th:href="@{/}" class="error-btn">Volver al inicio</a>
    </div>
</div>
</body>
</html>
