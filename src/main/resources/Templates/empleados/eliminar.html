<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Eliminar Empleado · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/Empleados.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container empleado-page">

        <div class="admin-card admin-card--form">
            <div class="admin-card-header">
                <h2>Eliminar Empleado</h2>
            </div>

            <div class="admin-warning-box">
                ¿Estás seguro de que deseas eliminar a
                "<strong th:text="${empleado.persona.nombre + ' ' + empleado.persona.apellido}">Juan Pérez</strong>"?
                Esta acción no se puede deshacer.
                <br><br>
                <em>Ten en cuenta que si este empleado tiene citas asociadas, eliminarlo podría causar un error de integridad referencial en la base de datos.</em>
            </div>

            <form th:action="@{'/empleados/eliminar/' + ${empleado.idEmpleado}}" method="post" class="admin-delete-form">
                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-primary" style="background:#8C2F2F; color:#FFFFFF !important;">Sí, eliminar empleado</button>
                    <a th:href="@{/empleados}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/empleados.js}"></script>
</th:block>
</body>
</html>
