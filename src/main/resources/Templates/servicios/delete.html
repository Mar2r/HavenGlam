<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Eliminar Servicio · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/Servicio.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container servicio-page">
        <div class="admin-card admin-card--confirm">
            <div class="admin-card-header">
                <h2>Confirmar Eliminación</h2>
            </div>
            <p class="admin-confirm-text">
                ¿Seguro que deseas eliminar permanentemente el servicio "<strong th:text="${servicio.nombreServicio}"></strong>"?
                Esta acción dará de baja el tratamiento del catálogo del salón.
            </p>
            <form th:action="@{/servicios/eliminar/{id}(id=${servicio.idServicio})}" method="post">
                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-danger">Sí, eliminar servicio</button>
                    <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/servicio.js}"></script>
</th:block>
</body>
</html>
