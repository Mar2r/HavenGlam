<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Nuevo producto · Haven Glam Admin</title>
    <link rel="stylesheet" th:href="@{/css/producto.css}">
</head>
<body>

<div class="container producto-page">

    <div class="admin-card admin-card--form">
        <div class="admin-card-header">
            <h2>Nuevo producto</h2>
        </div>

        <form th:action="@{/productos/crear}" th:object="${producto}" method="post">

            <div class="admin-form-group">
                <label for="nombreProducto">Nombre del producto</label>
                <input type="text" id="nombreProducto" th:field="*{nombreProducto}" />
                <div class="admin-error" th:if="${#fields.hasErrors('nombreProducto')}"
                     th:errors="*{nombreProducto}"></div>
            </div>

            <div class="admin-form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
                <div class="admin-error" th:if="${#fields.hasErrors('descripcion')}"
                     th:errors="*{descripcion}"></div>
            </div>

            <div class="admin-form-group">
                <label for="precio">Precio</label>
                <input type="number" step="0.01" min="0" id="precio" th:field="*{precio}" />
                <div class="admin-error" th:if="${#fields.hasErrors('precio')}"
                     th:errors="*{precio}"></div>
            </div>

            <div class="admin-form-group">
                <label for="stock">Stock</label>
                <input type="number" step="1" min="0" id="stock" th:field="*{stock}" />
                <div class="admin-error" th:if="${#fields.hasErrors('stock')}"
                     th:errors="*{stock}"></div>
            </div>

            <div class="admin-form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" th:field="*{categoria}">
                    <option value="">Selecciona una categoría</option>
                    <option th:each="c : ${categorias}"
                            th:value="${c.idCategoria}"
                            th:text="${c.nombreCategoria}"></option>
                </select>
                <div class="admin-error" th:if="${#fields.hasErrors('categoria')}"
                     th:errors="*{categoria}"></div>
            </div>

            <div class="admin-form-group">
                <label for="estado">Estado</label>
                <select id="estado" th:field="*{estado}">
                    <option value="">Selecciona un estado</option>
                    <option th:each="e : ${estados}"
                            th:value="${e.idEstado}"
                            th:text="${e.nombreEstado}"></option>
                </select>
                <div class="admin-error" th:if="${#fields.hasErrors('estado')}"
                     th:errors="*{estado}"></div>
            </div>

            <div class="admin-form-group">
                <label for="imagenUrl">URL de imagen</label>
                <input type="text" id="imagenUrl" th:field="*{imagenUrl}" />
                <div class="admin-error" th:if="${#fields.hasErrors('imagenUrl')}"
                     th:errors="*{imagenUrl}"></div>
            </div>

            <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</div>

<script th:src="@{/js/producto.js}"></script>
</body>
</html>
