<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">
<head>
    <meta charset="UTF-8" />
    <title>Eliminar cliente</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
    <link rel="stylesheet" th:href="@{/css/errores.css}">
</head>
<body>

<div layout:fragment="content">

    <div class="admin-card">
        <div class="admin-card-header">
            <h2>Eliminar cliente</h2>
        </div>

        <div class="admin-warning-box">
            Estás a punto de eliminar a
            <strong th:text="${cliente.persona != null ? cliente.persona.nombre + ' ' + cliente.persona.apellido : 'este cliente'}">Juan Pérez</strong>.
            Esta acción no se puede deshacer.
        </div>

        <dl class="admin-detail-grid">
            <div class="admin-detail-item">
                <dt>Teléfono</dt>
                <dd th:text="${cliente.persona != null ? cliente.persona.telefono : '—'}">70000000</dd>
            </div>
            <div class="admin-detail-item">
                <dt>Estado actual</dt>
                <dd th:text="${cliente.estado != null ? cliente.estado.nombreEstado : '—'}">Activo</dd>
            </div>
        </dl>

        <form th:action="@{'/clientes/eliminar/' + ${cliente.idCliente}}" method="post">
            <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary" style="background:#8A3A3A;">Sí, eliminar</button>
                <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
