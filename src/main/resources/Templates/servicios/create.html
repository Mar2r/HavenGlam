<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Nuevo servicio · Haven Glam Admin</title>
    <link rel="stylesheet" th:href="@{/css/servicio.css}">
</head>
<body>

<div class="container servicio-page">

    <div class="admin-card admin-card--form">
        <div class="admin-card-header">
            <h2>Nuevo servicio</h2>
        </div>

        <form th:action="@{/servicios/crear}" th:object="${servicio}" method="post"
              enctype="multipart/form-data">

            <div class="admin-form-group">
                <label for="nombreServicio">Nombre del servicio</label>
                <input type="text" id="nombreServicio" th:field="*{nombreServicio}"
                       required minlength="3" maxlength="50" autocomplete="off" />
                <div class="admin-error" th:if="${#fields.hasErrors('nombreServicio')}"
                     th:errors="*{nombreServicio}"></div>
            </div>

            <div class="admin-form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3" maxlength="200"></textarea>
                <div class="admin-error" th:if="${#fields.hasErrors('descripcion')}"
                     th:errors="*{descripcion}"></div>
            </div>

            <div class="admin-form-group">
                <label for="precio">Precio</label>
                <input type="number" step="0.01" min="0.01" required id="precio" th:field="*{precio}" />
                <div class="admin-error" th:if="${#fields.hasErrors('precio')}"
                     th:errors="*{precio}"></div>
            </div>

            <div class="admin-form-group">
                <label for="duracionMinutos">Duración</label>
                <input type="time" id="duracionMinutos" th:field="*{duracionMinutos}" required />
                <div class="admin-error" th:if="${#fields.hasErrors('duracionMinutos')}"
                     th:errors="*{duracionMinutos}"></div>
            </div>

            <div class="admin-form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" th:field="*{categoria.idCategoria}" required>
                    <option value="">Selecciona una categoría</option>
                    <option th:each="c : ${categorias}"
                            th:value="${c.idCategoria}"
                            th:text="${c.nombreCategoria}"></option>
                </select>
                <div class="admin-error" th:if="${#fields.hasErrors('categoria')}"
                     th:errors="*{categoria}"></div>
            </div>

            <div class="admin-form-group">
                <label for="estado">Estado</label>
                <select id="estado" th:field="*{estado.idEstado}" required>
                    <option value="">Selecciona un estado</option>
                    <option th:each="e : ${estados}"
                            th:value="${e.idEstado}"
                            th:text="${e.nombreEstado}"></option>
                </select>
                <div class="admin-error" th:if="${#fields.hasErrors('estado')}"
                     th:errors="*{estado}"></div>
            </div>

            <div class="admin-form-group">
                <div class="admin-error--box" th:if="${errorImagen}" th:text="${errorImagen}"></div>
                <label for="file">Imagen del servicio</label>
                <input type="file" id="file" name="file" accept="image/*" />
            </div>

            <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</div>

<script th:src="@{/js/servicio.js}"></script>
</body>
</html>
