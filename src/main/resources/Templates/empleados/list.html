<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Empleados · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/Empleados.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container empleado-page">
        <div class="admin-card">
            <div class="admin-card-header">
                <h2>Equipo y Profesionales</h2>
                <a th:href="@{/empleados/crear}" class="btn btn-primary">+ Nuevo empleado</a>
            </div>
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="empleado : ${empleados}">
                    <td th:text="${empleado.persona != null ? empleado.persona.nombre : ''}"></td>
                    <td th:text="${empleado.persona != null ? empleado.persona.apellido : ''}"></td>
                    <td th:text="${empleado.persona != null ? empleado.persona.telefono : ''}"></td>
                    <td th:text="${empleado.estado != null ? empleado.estado.nombreEstado : ''}"></td>
                    <td class="admin-table-actions">
                        <a th:href="@{/empleados/details/{id}(id=${empleado.idEmpleado})}" class="btn btn-secondary">Detalles</a>
                        <a th:href="@{/empleados/editar/{id}(id=${empleado.idEmpleado})}" class="btn btn-secondary">Editar</a>
                        <a th:href="@{/empleados/eliminar/{id}(id=${empleado.idEmpleado})}" class="btn btn-danger">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(empleados)}">
                    <td colspan="5" class="admin-table-empty">No hay empleados registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/empleados.js}"></script>
</th:block>
</body>
</html>
