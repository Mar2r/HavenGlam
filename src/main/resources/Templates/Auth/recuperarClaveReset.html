<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva contraseña · Haven Glam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap"
            rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" href="../../Static/css/Auth.css" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div class="auth-center-wrap">
    <div class="auth-card auth-card--standalone">

        <a th:href="@{/}" href="/" class="auth-brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
            </svg>
            <span>
                <span class="brand-title">Haven Glam</span>
                <span class="brand-tagline">Sanctuary &amp; Beauty</span>
            </span>
        </a>

        <!-- Token inválido o expirado -->
        <th:block th:if="${tokenInvalido}">
            <h1>Enlace no válido</h1>
            <p class="auth-sub">Este enlace ya expiró o no es correcto. Solicita uno nuevo para continuar.</p>
            <div class="auth-alert">El enlace de recuperación no es válido o expiró.</div>
            <a th:href="@{/recuperarClave}" class="auth-submit" style="display:block; text-align:center; text-decoration:none;">
                Solicitar nuevo enlace
            </a>
        </th:block>

        <!-- Token válido: formulario de nueva contraseña -->
        <th:block th:unless="${tokenInvalido}">
            <h1>Crea una nueva contraseña</h1>
            <p class="auth-sub">Elige una contraseña nueva para tu cuenta.</p>

            <form th:action="@{/recuperarClave/reset}" method="post">

                <input type="hidden" name="token" th:value="${token}" />

                <div class="auth-field">
                    <label for="nuevaContra">Nueva contraseña</label>
                    <input type="password" id="nuevaContra" name="nuevaContra" placeholder="Mínimo 6 caracteres" minlength="6" required autofocus />
                </div>

                <button type="submit" class="auth-submit">Actualizar contraseña</button>
            </form>
        </th:block>

        <p class="auth-foot">
            <a th:href="@{/login}" href="login.html">&larr; Volver a iniciar sesión</a>
        </p>
    </div>
</div>

</body>
</html>
