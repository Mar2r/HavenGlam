<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta · Haven Glam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap"
            rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" href="../../Static/css/auth.css" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div class="auth-center-wrap">
    <div class="auth-card auth-card--standalone auth-card--wide">

        <a th:href="@{/}" href="/" class="auth-brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
            </svg>
            <span>
                <span class="brand-title">Haven Glam</span>
                <span class="brand-tagline">Sanctuary &amp; Beauty</span>
            </span>
        </a>

        <h1>Crea tu cuenta</h1>
        <p class="auth-sub">Regístrate para reservar servicios, guardar tus datos y llevar el control de tus citas.</p>

        <!-- Se muestra si RegistroService lanza IllegalStateException (ej. correo duplicado) -->
        <div class="auth-alert" th:if="${errorRegistro}" th:text="${errorRegistro}">
            Ese correo ya está registrado.
        </div>

        <form th:action="@{/clientes/registrar}" th:object="${registroCliente}" method="post" novalidate>

            <div class="auth-row-split">
                <div class="auth-field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Juan" />
                    <div class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="auth-field">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" th:field="*{apellido}" placeholder="Pérez" />
                    <div class="field-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                </div>
            </div>

            <div class="auth-row-split">
                <div class="auth-field">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" th:field="*{telefono}" placeholder="70000000" />
                    <div class="field-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                </div>
                <div class="auth-field">
                    <label for="dui">DUI <span class="field-hint">(opcional)</span></label>
                    <input type="text" id="dui" th:field="*{dui}" placeholder="00000000-0" />
                    <div class="field-error" th:if="${#fields.hasErrors('dui')}" th:errors="*{dui}"></div>
                </div>
            </div>

            <div class="auth-field">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" th:field="*{direccion}" placeholder="San Salvador, El Salvador" />
                <div class="field-error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
            </div>

            <div class="auth-field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" th:field="*{correo}" placeholder="tucorreo@ejemplo.com" />
                <div class="field-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
            </div>

            <div class="auth-field">
                <label for="contra">Contraseña</label>
                <input type="password" id="contra" th:field="*{contra}" placeholder="Mínimo 6 caracteres" />
                <div class="field-error" th:if="${#fields.hasErrors('contra')}" th:errors="*{contra}"></div>
            </div>

            <button type="submit" class="auth-submit">Registrarme</button>
        </form>

        <p class="auth-foot">
            ¿Ya tienes cuenta? <a th:href="@{/login}" href="#">Inicia sesión</a>
        </p>
    </div>
</div>

</body>
</html>
