<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">
<head>
    <meta charset="UTF-8" />
    <title>Eliminar empleado</title>
    <link rel="stylesheet" th:href="@{/css/empleados.css}">
    <link rel="stylesheet" th:href="@{/css/errores.css}">
</head>
<body>

<div layout:fragment="content">

    <div class="container empleado-page">
        <div class="admin-card">
            <div class="admin-card-header">
                <h2>Eliminar empleado</h2>
            </div>

            <div class="admin-warning-box">
                Estás a punto de eliminar a
                <strong th:text="${empleado.persona != null ? empleado.persona.nombre + ' ' + empleado.persona.apellido : 'este empleado'}">Juan Pérez</strong>.
                Esta acción no se puede deshacer.
            </div>

            <dl class="admin-detail-grid">
                <div class="admin-detail-item">
                    <dt>Teléfono</dt>
                    <dd th:text="${empleado.persona != null ? empleado.persona.telefono : '—'}">70000000</dd>
                </div>
                <div class="admin-detail-item">
                    <dt>Estado actual</dt>
                    <dd th:text="${empleado.estado != null ? empleado.estado.nombreEstado : '—'}">Activo</dd>
                </div>
            </dl>

            <form th:action="@{'/empleados/eliminar/' + ${empleado.idEmpleado}}" method="post">
                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-primary" style="background:#8A3A3A;">Sí, eliminar</button>
                    <a th:href="@{/empleados}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

</body>
</html>
