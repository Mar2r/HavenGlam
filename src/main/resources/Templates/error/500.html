<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Error del servidor · Haven Glam</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body class="error-body">
<div class="error-center-wrap">
    <div class="error-card">
        <span class="error-code">500</span>
        <h1 th:text="${titulo} ?: 'Algo salió mal'">Algo salió mal</h1>
        <p th:text="${mensaje} ?: 'Ocurrió un error inesperado. Ya estamos al tanto e intentaremos resolverlo pronto.'"></p>
        <a th:href="@{/}" class="error-btn">Volver al inicio</a>
    </div>
</div>
</body>
</html>
