<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Editar categoría · Haven Glam Admin</title>
    <link rel="stylesheet" th:href="@{/css/categoria.css}">
</head>
<body>

<div class="container categoria-page">

    <div class="admin-card admin-card--form">
        <div class="admin-card-header">
            <h2>Editar categoría</h2>
        </div>

        <form th:action="@{'/categorias/edit/' + ${categoria.idCategoria}}" th:object="${categoria}" method="post">

            <input type="hidden" th:field="*{idCategoria}" />

            <div class="admin-form-group">
                <label for="nombreCategoria">Nombre</label>
                <input type="text" id="nombreCategoria" th:field="*{nombreCategoria}" />
                <div class="admin-error" th:if="${#fields.hasErrors('nombreCategoria')}"
                     th:errors="*{nombreCategoria}"></div>
            </div>

            <div class="admin-form-group">
                <label for="estado">Estado</label>
                <select id="estado" th:field="*{estado}">
                    <option th:each="e : ${estados}"
                            th:value="${e.idEstado}"
                            th:text="${e.nombreEstado}"></option>
                </select>
            </div>

            <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</div>

<script th:src="@{/js/categoria.js}"></script>
</body>
</html>
