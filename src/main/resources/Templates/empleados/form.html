<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Nuevo Empleado · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/Empleados.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container empleado-page">

        <div class="admin-card admin-card--form">
            <div class="admin-card-header">
                <h2>Registrar nuevo empleado</h2>
            </div>

            <!-- Se muestra si RegistroService lanza IllegalStateException (ej. correo duplicado) -->
            <div class="admin-error--box" th:if="${errorRegistro}" th:text="${errorRegistro}">
                Ese correo ya está registrado.
            </div>

            <form th:action="@{/empleados/registrar}" th:object="${registroEmpleado}" method="post">

                <div class="admin-form-row">
                    <div class="admin-form-group">
                        <label for="nombre">Nombre <span style="color:#8C2F2F;">*</span></label>
                        <input type="text" id="nombre" th:field="*{nombre}" pattern="[\p{L}\s]+" title="Solo letras" required />
                        <div class="admin-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="admin-form-group">
                        <label for="apellido">Apellido <span style="color:#8C2F2F;">*</span></label>
                        <input type="text" id="apellido" th:field="*{apellido}" pattern="[\p{L}\s]+" title="Solo letras" required />
                        <div class="admin-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                    </div>
                </div>

                <div class="admin-form-row">
                    <div class="admin-form-group">
                        <label for="telefono">Teléfono <span style="color:#8C2F2F;">*</span></label>
                        <input type="text" id="telefono" th:field="*{telefono}" pattern="[0-9]{8}" inputmode="numeric" maxlength="8" title="Debe tener exactamente 8 dígitos" required placeholder="Ej: 78901234" />
                        <div class="admin-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                    </div>

                    <div class="admin-form-group">
                        <label for="dui">DUI <span style="color:#8C2F2F;">*</span></label>
                        <input type="text" id="dui" th:field="*{dui}" pattern="[0-9]{8}-[0-9]" title="Formato 00000000-0" maxlength="10" required placeholder="00000000-0" />
                        <div class="admin-error" th:if="${#fields.hasErrors('dui')}" th:errors="*{dui}"></div>
                    </div>
                </div>

                <div class="admin-form-group">
                    <label for="direccion">Dirección <span style="color:#8C2F2F;">*</span></label>
                    <input type="text" id="direccion" th:field="*{direccion}" required />
                    <div class="admin-error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                </div>

                <div class="admin-form-row">
                    <div class="admin-form-group">
                        <label for="correo">Correo electrónico <span style="color:#8C2F2F;">*</span></label>
                        <input type="email" id="correo" th:field="*{correo}" required placeholder="ejemplo@havenglam.com" />
                        <div class="admin-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                    </div>

                    <div class="admin-form-group">
                        <label for="contra">Contraseña temporal <span style="color:#8C2F2F;">*</span></label>
                        <input type="password" id="contra" th:field="*{contra}" required />
                        <div class="admin-error" th:if="${#fields.hasErrors('contra')}" th:errors="*{contra}"></div>
                    </div>
                </div>

                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-primary">Registrar empleado</button>
                    <a th:href="@{/empleados}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/empleados.js}"></script>
</th:block>
</body>
</html>
