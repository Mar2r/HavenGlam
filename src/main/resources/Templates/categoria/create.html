<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Nueva Categoría · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/categoria.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container categoria-page">

        <div class="admin-card admin-card--form">
            <div class="admin-card-header">
                <h2>Nueva Categoría</h2>
            </div>

            <form th:action="@{/categorias/create}" th:object="${categoria}" method="post" class="needs-validation" novalidate>

                <div class="admin-form-group">
                    <label for="nombreCategoria">Nombre de la categoría <span style="color:#8C2F2F;">*</span></label>
                    <input type="text" id="nombreCategoria" th:field="*{nombreCategoria}"
                           required minlength="2" maxlength="60" autocomplete="off"
                           placeholder="Ej: Cuidado Facial" />
                    <div class="admin-error" th:if="${#fields.hasErrors('nombreCategoria')}"
                         th:errors="*{nombreCategoria}"></div>
                </div>

                <div class="admin-form-group">
                    <label for="estado">Estado <span style="color:#8C2F2F;">*</span></label>
                    <select id="estado" th:field="*{estado}" required>
                        <option value="">Selecciona un estado</option>
                        <option th:each="e : ${estados}"
                                th:value="${e.idEstado}"
                                th:text="${e.nombreEstado}"></option>
                    </select>
                    <div class="admin-error" th:if="${#fields.hasErrors('estado')}"
                         th:errors="*{estado}"></div>
                </div>

                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-primary">Guardar categoría</button>
                    <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/categoria.js}"></script>
</th:block>
</body>
</html>
