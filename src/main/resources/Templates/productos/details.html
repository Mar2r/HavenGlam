<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Detalle del Producto · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/Producto.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container producto-page">
        <div class="admin-card admin-card--details">
            <div class="admin-card-header">
                <h2 th:text="${producto.nombreProducto}"></h2>
            </div>
            <dl class="admin-details-list">
                <dt>ID</dt>
                <dd th:text="${producto.idProducto}"></dd>

                <dt>Nombre</dt>
                <dd th:text="${producto.nombreProducto}"></dd>

                <dt>Descripción</dt>
                <dd th:text="${producto.descripcion != null && !producto.descripcion.isBlank() ? producto.descripcion : 'Sin descripción'}"></dd>

                <dt>Precio</dt>
                <dd th:text="${'$' + producto.precio}"></dd>

                <dt>Stock disponible</dt>
                <dd th:text="${producto.stock + ' unidades'}"></dd>

                <dt>Categoría</dt>
                <dd th:text="${producto.categoria != null ? producto.categoria.nombreCategoria : 'Sin categoría'}"></dd>

                <dt>Estado</dt>
                <dd>
                    <span th:text="${producto.estado != null ? producto.estado.nombreEstado : 'Sin estado'}"></span>
                </dd>

                <dt>Imagen</dt>
                <dd>
                    <img th:if="${producto.imagenUrl != null}" th:src="${producto.imagenUrl}"
                         style="max-width: 220px; border-radius: 10px; border: 1px solid var(--creme);" alt="Producto" />
                    <span th:if="${producto.imagenUrl == null}" style="color:var(--muted);">Sin imagen registrada</span>
                </dd>
            </dl>
            <div class="admin-form-actions">
                <a th:href="@{/productos/editar/{id}(id=${producto.idProducto})}" class="btn btn-secondary">Editar producto</a>
                <a th:href="@{/productos}" class="btn btn-primary">Volver al inventario</a>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/producto.js}"></script>
</th:block>
</body>
</html>
