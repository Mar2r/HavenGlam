<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layoutAdmin}">

<head>
    <title>Nuevo Servicio · Haven Glam Admin</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/Servicio.css}">
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container servicio-page">

        <div class="admin-card admin-card--form">
            <div class="admin-card-header">
                <h2>Nuevo Servicio</h2>
            </div>

            <form th:action="@{/servicios/crear}" th:object="${servicio}" method="post"
                  enctype="multipart/form-data" class="needs-validation" novalidate>

                <!-- Nombre del servicio -->
                <div class="admin-form-group">
                    <label for="nombreServicio">Nombre del servicio <span style="color:#8C2F2F;">*</span></label>
                    <input type="text" id="nombreServicio" th:field="*{nombreServicio}"
                           required minlength="3" maxlength="50" autocomplete="off"
                           placeholder="Ej: Balayage y tratamiento capilar" />
                    <div class="admin-error" th:if="${#fields.hasErrors('nombreServicio')}"
                         th:errors="*{nombreServicio}"></div>
                </div>

                <!-- Descripción -->
                <div class="admin-form-group">
                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="3" maxlength="200"
                              placeholder="Describe brevemente el procedimiento, beneficios y detalles del servicio..."></textarea>
                    <div class="admin-error" th:if="${#fields.hasErrors('descripcion')}"
                         th:errors="*{descripcion}"></div>
                </div>

                <!-- Precio -->
                <div class="admin-form-group">
                    <label for="precio">Precio ($) <span style="color:#8C2F2F;">*</span></label>
                    <input type="number" step="0.01" min="0.01" max="99999.99" required id="precio"
                           th:field="*{precio}" placeholder="Ej: 25.00" />
                    <div class="admin-error" th:if="${#fields.hasErrors('precio')}"
                         th:errors="*{precio}"></div>
                </div>

                <!-- Duración -->
                <div class="admin-form-group">
                    <label for="duracionMinutos">Duración estimada <span style="color:#8C2F2F;">*</span></label>
                    <input type="time" id="duracionMinutos" th:field="*{duracionMinutos}" required min="00:05" />
                    <div class="admin-error" th:if="${#fields.hasErrors('duracionMinutos')}"
                         th:errors="*{duracionMinutos}"></div>
                </div>

                <!-- Categoría -->
                <div class="admin-form-group">
                    <label for="categoria">Categoría <span style="color:#8C2F2F;">*</span></label>
                    <select id="categoria" th:field="*{categoria.idCategoria}" required>
                        <option value="">Selecciona una categoría</option>
                        <option th:each="c : ${categorias}"
                                th:value="${c.idCategoria}"
                                th:text="${c.nombreCategoria}"></option>
                    </select>
                    <div class="admin-error" th:if="${#fields.hasErrors('categoria')}"
                         th:errors="*{categoria}"></div>
                </div>

                <!-- Estado -->
                <div class="admin-form-group">
                    <label for="estado">Estado <span style="color:#8C2F2F;">*</span></label>
                    <select id="estado" th:field="*{estado.idEstado}" required>
                        <option value="">Selecciona un estado</option>
                        <option th:each="e : ${estados}"
                                th:value="${e.idEstado}"
                                th:text="${e.nombreEstado}"></option>
                    </select>
                    <div class="admin-error" th:if="${#fields.hasErrors('estado')}"
                         th:errors="*{estado}"></div>
                </div>

                <!-- Imagen -->
                <div class="admin-form-group">
                    <div class="admin-error--box" th:if="${errorImagen}" th:text="${errorImagen}"></div>
                    <label for="file">Fotografía del servicio (opcional, máx 5MB)</label>
                    <input type="file" id="file" name="file" accept="image/png, image/jpeg, image/jpg, image/webp" />
                </div>

                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-primary">Guardar servicio</button>
                    <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/servicio.js}"></script>
</th:block>
</body>
</html>
